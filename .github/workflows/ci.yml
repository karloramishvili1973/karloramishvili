name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run contracts tests
        run: pnpm --filter ./packages/contracts test || true
      - name: Run frontend tests (if any)
        run: |
          if [ -f packages/frontend/package.json ]; then
            pnpm --filter ./packages/frontend test || echo "No frontend tests or tests failed"
          else
            echo "No frontend package"
          fi
      - name: Run backend tests (if any)
        run: |
          if [ -f packages/backend/package.json ]; then
            pnpm --filter ./packages/backend test || echo "No backend tests or tests failed"
          else
            echo "No backend package"
          fi
